
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport
  " content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050b16;
  color: #00eaff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 500px;
  padding: 25px;
  text-align: center;
}

h1 {
  font-size: 38px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #00eaff;
}

.circle {
  width: 190px;
  height: 190px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: 45px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 35px #00eaff;
  font-size: 65px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00eaff; }
  to { box-shadow: 0 0 45px #00eaff; }
}

button {
  background: transparent;
  color: #00eaff;
  border: 2px solid #00eaff;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 17px;
  margin: 10px;
}

button:active {
  background: #00eaff;
  color: #050b16;
}

#answer {
  margin-top: 30px;
  color: white;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="app">
  <h1>J.A.R.V.I.S</h1>
  <p>PERSONAL AI ASSISTANT</p>

  <div class="circle">◉</div>

  <p id="status">SYSTEM ONLINE</p>

  <button onclick="listen()">🎙 TALK TO JARVIS</button>

  <div id="answer">Waiting for your command...</div>
</div>

<script>
function speak(text) {
  const synth = window.speechSynthesis;

  if (!synth) {
    document.getElementById("status").innerText =
      "VOICE NOT SUPPORTED";
    return;
  }

  synth.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 1;
  speech.pitch = 1;
  speech.volume = 1;

  speech.onerror = function(event) {
    document.getElementById("status").innerText =
      "VOICE ERROR: " + event.error;
  };

  synth.speak(speech);
}
